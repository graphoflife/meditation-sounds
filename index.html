<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meditation Sounds</title>
<meta name="description" content="Mix real nature recordings for meditation: rain, ocean, wind, birds, wind chimes, singing bowls and more.">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-title" content="Meditation">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main class="app">
  <header>
    <h1>Meditation Sounds</h1>
    <p class="status" id="status" aria-live="polite"></p>
  </header>
  <div class="grid" id="grid"></div>
  <p class="note">Real field recordings, free to use (<a href="https://github.com/graphoflife/meditation-sounds/blob/main/CREDITS.md">credits</a>). Noise and binaural beats are generated live. Binaural beats need headphones.</p>
</main>
<nav class="bar" aria-label="Playback">
  <div class="bar-inner">
    <button class="chip" id="timer" type="button" aria-label="Sleep timer"></button>
    <button class="play" id="play" type="button" aria-label="Play"></button>
    <button class="chip" id="clear" type="button" aria-label="Turn all sounds off"></button>
  </div>
</nav>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound analyzer</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; background: #111; color: #ddd; margin: 16px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: center; margin-bottom: 6px; }
  canvas { width: 100%; height: 90px; image-rendering: pixelated; background: #000; }
  b { color: #fff; }
  .warn { color: #f88; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
const { SOUNDS, Shared } = await import('../audio.js?' + Date.now());

const SR = 48000;
const params = new URLSearchParams(location.search);
const DUR = Number(params.get('dur') || 30);
const only = params.get('only')?.split(',');

// K-weighting (ITU-R BS.1770) biquads at 48 kHz
const K1 = { b: [1.53512485958697, -2.69169618940638, 1.19839281085285], a: [1, -1.69065929318241, 0.73248077421585] };
const K2 = { b: [1, -2, 1], a: [1, -1.99004745483398, 0.99007225036621] };
function biquad(x, { b, a }) {
  const y = new Float64Array(x.length);
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const v = b[0] * x[i] + b[1] * x1 + b[2] * x2 - a[1] * y1 - a[2] * y2;
    x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
  }
  return y;
}

function loudness(buf) {
  const chans = [0, 1].map((c) => biquad(biquad(buf.getChannelData(c), K1), K2));
  const block = 0.4 * SR, step = 0.1 * SR, z = [];
  for (let s = 0; s + block <= buf.length; s += step) {
    let sum = 0;
    for (const ch of chans) { let m = 0; for (let i = s; i < s + block; i++) m += ch[i] * ch[i]; sum += m / block; }
    z.push(sum);
  }
  const L = (v) => -0.691 + 10 * Math.log10(v);
  const abs = z.filter((v) => L(v) > -70);
  if (!abs.length) return -Infinity;
  const rel = L(abs.reduce((a, b) => a + b) / abs.length) - 10;
  const g = abs.filter((v) => L(v) > rel);
  return { integrated: L(g.reduce((a, b) => a + b) / g.length), maxMomentary: L(Math.max(...z)), activeFrac: g.length / z.length };
}

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < len / 2; j++) {
        const ar = re[i + j + len / 2] * cr - im[i + j + len / 2] * ci;
        const ai = re[i + j + len / 2] * ci + im[i + j + len / 2] * cr;
        re[i + j + len / 2] = re[i + j] - ar; im[i + j + len / 2] = im[i + j] - ai;
        re[i + j] += ar; im[i + j] += ai;
        [cr, ci] = [cr * wr - ci * wi, cr * wi + ci * wr];
      }
    }
  }
}

function spectrogram(canvas, buf, fmax = 11000) {
  const N = 1024, hop = Math.floor(buf.length / 900), L = buf.getChannelData(0), R = buf.getChannelData(1);
  const cols = Math.floor((buf.length - N) / hop), bins = Math.floor((fmax / SR) * N);
  canvas.width = cols; canvas.height = bins;
  const ctx = canvas.getContext('2d'), img = ctx.createImageData(cols, bins);
  const re = new Float64Array(N), im = new Float64Array(N);
  for (let c = 0; c < cols; c++) {
    for (let i = 0; i < N; i++) { const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N); re[i] = (L[c * hop + i] + R[c * hop + i]) * 0.5 * w; im[i] = 0; }
    fft(re, im);
    for (let b = 0; b < bins; b++) {
      const db = 10 * Math.log10((re[b] ** 2 + im[b] ** 2) / N + 1e-20);
      const v = Math.max(0, Math.min(1, (db + 90) / 70));
      const p = ((bins - 1 - b) * cols + c) * 4;
      img.data[p] = 255 * Math.min(1, v * 1.6); img.data[p + 1] = 255 * v * v; img.data[p + 2] = 255 * Math.max(0, 1 - Math.abs(v - 0.35) * 3) * 0.8; img.data[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

async function render(def, variant) {
  const ctx = new OfflineAudioContext(2, SR * DUR, SR);
  const sh = new Shared(ctx, ctx.destination);
  const s = def.make(sh, variant);
  s.out.connect(ctx.destination);
  s.wet.connect(sh.verbIn);
  const t0 = performance.now();
  s.start(0);
  s.schedule(DUR);
  const buf = await ctx.startRendering();
  return { buf, ms: performance.now() - t0 };
}

const out = document.getElementById('out');
window.results = [];
for (const def of SOUNDS) {
  if (only && !only.includes(def.id)) continue;
  for (const variant of def.variants ?? [undefined]) {
    const { buf, ms } = await render(def, variant);
    let peak = 0, nan = false;
    for (let c = 0; c < 2; c++) for (const v of buf.getChannelData(c)) { if (Number.isNaN(v)) nan = true; peak = Math.max(peak, Math.abs(v)); }
    const lu = loudness(buf);
    const res = { id: def.id, variant, lufs: +lu.integrated.toFixed(1), maxM: +lu.maxMomentary.toFixed(1), active: +lu.activeFrac.toFixed(2), peakDb: +(20 * Math.log10(peak)).toFixed(1), nan, ms: Math.round(ms) };
    window.results.push(res);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div><b>${def.name}${variant ? ' · ' + variant : ''}</b><br>${res.lufs} LUFS · max ${res.maxM}<br>peak ${res.peakDb} dB · ${res.ms} ms<br>active ${res.active}${nan ? ' <span class=warn>NaN!</span>' : ''}</div><canvas></canvas>`;
    out.append(row);
    spectrogram(row.querySelector('canvas'), buf);
  }
}
window.done = true;
</script>
</body>
</html>
